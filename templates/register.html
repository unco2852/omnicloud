{% extends "base.html" %}

{% block title %}Kayıt Ol | OmniCloud{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 200px); padding: 2.5rem 1rem; position: relative; z-index: 20;">
    <div class="auth-card" style="width: 100%; max-width: 440px;">
        <div class="auth-header">
            <div class="auth-logo-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Hesap Oluştur</h2>
            <p>Seçilen Plan: <strong style="color: var(--accent);">{{ plan }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
            <input type="hidden" name="plan" value="{{ plan }}"/>

            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-user"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="kullaniciadi" 
                        required 
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-Posta Adresi</label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ornek@mail.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Telefon Numarası (Opsiyonel)</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-phone"></i>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="05XX XXX XX XX" 
                        autocomplete="tel"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Şifre (En az 8 karakter)</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required 
                        minlength="8" 
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password_confirm">Şifre Tekrar</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-shield"></i>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        placeholder="••••••••" 
                        required 
                        minlength="8" 
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-auth-submit">
                <i class="fa-solid fa-check"></i>
                <span>Kaydı Tamamla ve Başla</span>
            </button>
        </form>

        <div class="auth-divider">
            <span>VEYA</span>
        </div>

        <a href="#" class="btn-google-login">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Google ile Kayıt Ol</span>
        </a>

        <div class="auth-footer-links">
            <p>Zaten bir hesabınız var mı? <a href="{{ url_for('login') }}">Giriş Yap</a></p>
            <p><a href="{{ url_for('plans') }}" class="support-link"><i class="fa-solid fa-arrow-left"></i> Farklı bir paket seç</a></p>
        </div>
    </div>
</div>
{% endblock %}
